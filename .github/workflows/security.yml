name: Security

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  malware-scan:
    name: malware-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan for malware and dangerous code
        run: node .github/scripts/malware-scan.mjs

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  rust-audit:
    name: rust-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Audit Rust dependencies
        run: |
          set -euo pipefail
          if ! find . -name Cargo.lock -not -path '*/node_modules/*' | grep -q .; then
            echo "No Cargo.lock found; skipping."
            exit 0
          fi
          cargo install cargo-audit --locked --quiet
          failed=0
          while IFS= read -r lock; do
            echo "::group::cargo audit $lock"
            cargo audit --file "$lock" || failed=1
            echo "::endgroup::"
          done < <(find . -name Cargo.lock -not -path '*/node_modules/*')
          exit $failed

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  codeql-python:
    name: codeql-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
