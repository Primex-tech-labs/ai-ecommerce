name: CI

on:
  push:
    branches: [main, phase-3-db-auth, phase-3b-hardening]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: TypeScript monorepo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: primex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/primex
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/web db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Import legacy JSON (idempotent)
        run: |
          mkdir -p apps/web/.data
          node -e "const fs=require('fs');fs.writeFileSync('apps/web/.data/orders.json', JSON.stringify({orders:{ci_import_1:{orderId:'ci_import_1',buyer:'GB',seller:'GS',token:'CT',amount:'10000000',status:'created',ledger:1,escrowContractId:'CE',updatedAt:new Date().toISOString()}}}))"
          pnpm --filter @repo/web db:import-orders
          pnpm --filter @repo/web db:import-orders
      - name: Migrations are reversible
        run: |
          pnpm --filter @repo/web db:rollback
          pnpm --filter @repo/web db:migrate
      - run: pnpm build

  ai:
    name: Python AI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy .
      - run: pytest

  contracts:
    name: Soroban contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pip install -e "apps/ai-service[dev]"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

